# Gemma 4 31B replacement for Mistral on port 8000
# Run: docker compose -f docker-compose-update.yml up -d vllm-reasoning
#
# This replaces the mmcp-vllm-reasoning-1 container (Mistral-Small-3.1-24B-FP8)
# with Gemma 4 31B-IT on the same port 8000.
# Qwen VL stays on port 8001 unchanged.
#
# IMPORTANT: You need to accept the Gemma license on HuggingFace first:
# https://huggingface.co/google/gemma-4-31B-it
# Then set HF_TOKEN in your environment or .env file.

services:
  vllm-reasoning:
    image: vllm/vllm-openai:latest
    container_name: mmcp-vllm-reasoning-1
    ports:
      - "8000:8000"
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    command:
      - --model=google/gemma-4-31B-it
      - --served-model-name=gemma4-31b
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1
      - --dtype=bfloat16
      - --max-model-len=16384
      - --max-num-seqs=16
      - --gpu-memory-utilization=0.45
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser=gemma4
      - --reasoning-parser=gemma4
      - --trust-remote-code
      - --enable-log-requests
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

  # Qwen VL stays unchanged on port 8001
  # vllm-vision:
  #   (keep existing config)
